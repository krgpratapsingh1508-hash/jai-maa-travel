<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jai Maa Travels - Master Admin</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; }
        h2 { color: #ff5722; text-align: center; margin-bottom: 20px; }
        
        /* Login Box Styling */
        .login-box { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background-color: #ff5722; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        
        /* Dashboard & Table Styling */
        .dashboard-container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .table-responsive { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { border: 1px solid #ddd; padding: 12px; font-size: 14px; }
        th { background-color: #ff5722; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        /* Dropdown Status Styling */
        select { padding: 6px; border-radius: 4px; font-weight: bold; border: 1px solid #ccc; cursor: pointer; }
        .hidden { display: none !important; }
        .logout-btn { background: red; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; float: right; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. 🔒 ADMIN LOGIN PAGE -->
    <div id="loginPage" class="login-box">
        <h2>🔒 Admin Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Admin Name</label>
                <input type="text" id="adminName" required placeholder="Enter Admin Name">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" required placeholder="Enter Password">
            </div>
            <button type="submit" class="btn">Login to Dashboard</button>
        </form>
    </div>

    <!-- 2. 📋 MASTER DASHBOARD PAGE (Default Hidden) -->
    <div id="dashboardPage" class="dashboard-container hidden">
        <button id="logoutBtn" class="logout-btn">Logout</button>
        <h2>📋 Jai Maa Travels - Master Booking List</h2>
        <p style="text-align: center; font-weight: bold; color: #555;">Welcome, <span id="displayAdminName" style="color:#ff5722;"></span></p>
        
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>📅 Booking Date & Time</th>
                        <th>👤 Customer Name</th>
                        <th>📞 Phone Number</th>
                        <th>📍 Destination</th>
                        <th>📆 Travel Date</th>
                        <th>⚙️ Status</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <!-- Data internet se yahan automatic load hoga -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const sUrl = "https://supabase.co"; 
        const sKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndidGZweHZzd21qbmNsd3J5b3hzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDA2NzA3MjEsImV4cCI6MjA1NjI0NjcyMX0.XgI8v69Ew7C5r5_U84x2mP1-t8-eN9fO9k_N2g67b8U";

        // Login Submit Handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nameInput = document.getElementById('adminName').value;
            const passwordInput = document.getElementById('adminPassword').value;

            // Name aur Password Check
            if (nameInput.toLowerCase() === "admin" && passwordInput === "1234") {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('dashboardPage').classList.remove('hidden');
                document.getElementById('displayAdminName').innerText = nameInput;
                fetchLiveBookings(); // Live list load karein
            } else {
                alert("Galat Admin Name ya Password! Access Denied.");
            }
        });

        // Live Database se Data Fetch karne ka function
        async function fetchLiveBookings() {
            const tableBody = document.getElementById('adminTableBody');
            tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Loading live bookings...</td></tr>`;

            try {
                const response = await fetch(`${sUrl}/rest/v1/bookings?select=*&order=id.desc`, {
                    method: 'GET',
                    headers: { 'apikey': sKey, 'Authorization': `Bearer ${sKey}` }
                });

                const bookings = await response.json();
                tableBody.innerHTML = "";

                if (bookings.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No bookings found online.</td></tr>`;
                    return;
                }

                bookings.forEach(booking => {
                    // Booking ka asli Date aur Time set karna
                    const submitDate = new Date(booking.created_at).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
                    const currentStatus = booking.status || 'Book';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${submitDate}</strong></td>
                        <td>${booking.name}</td>
                        <td><a href="tel:${booking.phone}">${booking.phone}</a></td>
                        <td>${booking.destination}</td>
                        <td>${booking.date}</td>
                        <td>
                            <select onchange="updateStatus(${booking.id}, this.value)">
                                <option value="Book" ${currentStatus === 'Book' ? 'selected' : ''}>Book</option>
                                <option value="Pending" ${currentStatus === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Approve" ${currentStatus === 'Approve' ? 'selected' : ''}>Approve</option>
                                <option value="Payment Pending" ${currentStatus === 'Payment Pending' ? 'selected' : ''}>Payment Pending</option>
                                <option value="Final Done" ${currentStatus === 'Final Done' ? 'selected' : ''}>Final Done</option>
                            </select>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });
            } catch (error) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">Database se connect karne me dikkat aa rahi hai.</td></tr>`;
            }
        }

        // Dropdown Status badalne aur save karne ka function
        async function updateStatus(bookingId, newStatus) {
            try {
                const response = await fetch(`${sUrl}/rest/v1/bookings?id=eq.${bookingId}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': sKey,
                        'Authorization': `Bearer ${sKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                if (response.ok) {
                    alert("Status badal gaya hai!");
                } else {
                    alert("Status update nahi ho paya.");
                }
            } catch (error) {
                alert("Network error!");
            }
        }

        // Logout Handler
        document.getElementById('logoutBtn').addEventListener('click', function() {
            document.getElementById('dashboardPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('loginForm').reset();
        });
    </script>
</body>
</html>

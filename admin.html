<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jai Maa Travels - Master Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; }
        h2 { color: #ff5722; text-align: center; margin-bottom: 20px; }
        .login-box { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background-color: #ff5722; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .dashboard-container { max-width: 1100px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .table-responsive { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { border: 1px solid #ddd; padding: 12px; font-size: 14px; }
        th { background-color: #ff5722; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        select { padding: 6px; border-radius: 4px; font-weight: bold; border: 1px solid #ccc; cursor: pointer; }
        .hidden { display: none !important; }
        .logout-btn { background: red; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; float: right; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. 🔒 SECURITY ADMIN LOGIN -->
    <div id="loginPage" class="login-box">
        <h2>🔒 Admin Master Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Admin Name</label>
                <input type="text" id="adminName" required placeholder="Enter Admin Name">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" required placeholder="Enter Password">
            </div>
            <button type="submit" class="btn">Login to Dashboard</button>
        </form>
    </div>

    <!-- 2. 📋 CLEAN MASTER BOOKING LIST TABLE -->
    <div id="dashboardPage" class="dashboard-container hidden">
        <button id="logoutBtn" class="logout-btn">Logout</button>
        <h2>📋 Jai Maa Travels - Global Live Bookings</h2>
        
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>📅 Booking Date & Time</th>
                        <th>👤 Customer Name</th>
                        <th>📞 Phone Number</th>
                        <th>📍 Destination</th>
                        <th>📆 Travel Date</th>
                        <th>⚙️ Current Status</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <!-- Data live yahan load hoga -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Formspree Reading Token (Authorization Link)
        const fetchUrl = "https://formspree.io";
        const secretToken = "hash_f8e6b1d927a43cf98e0114b726cbb159"; 

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nameInput = document.getElementById('adminName').value;
            const passwordInput = document.getElementById('adminPassword').value;

            if (nameInput.toLowerCase() === "admin" && passwordInput === "1234") {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('dashboardPage').classList.remove('hidden');
                fetchGlobalList(); 
            } else {
                alert("Galat Admin Name ya Password!");
            }
        });

        // Formspree cloud sheet se 100% sahi data read karne ka main system
        async function fetchGlobalList() {
            const tableBody = document.getElementById('adminTableBody');
            tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:15px; font-weight:bold;">Fetching live global bookings...</td></tr>`;

            try {
                const response = await fetch(fetchUrl, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${secretToken}` }
                });

                const data = await response.json();
                const submissions = data.submissions;
                tableBody.innerHTML = "";

                if (!submissions || submissions.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:15px;">No bookings found online yet.</td></tr>`;
                    return;
                }

                submissions.forEach((sub) => {
                    const extraData = sub.data;
                    
                    // Ekdam exact and accurate fields map karna
                    const submitTime = extraData["SubmitTime"] || new Date(sub.submitted_at).toLocaleString('en-IN');
                    const name = extraData["Name"] || 'N/A';
                    const phone = extraData["Phone"] || 'N/A';
                    const destination = extraData["Destination"] || 'N/A';
                    const travelDate = extraData["TravelDate"] || 'N/A';
                    
                    // Local memory setting to lock status configurations
                    const savedStatus = localStorage.getItem(`status_global_${sub.id}`) || 'Book';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${submitTime}</strong></td>
                        <td>${name}</td>
                        <td><a href="tel:${phone}" style="color:#ff5722; font-weight:bold; text-decoration:none;">${phone}</a></td>
                        <td>${destination}</td>
                        <td>${travelDate}</td>
                        <td>
                            <select onchange="saveLocalStatus('${sub.id}', this.value)">
                                <option value="Book" ${savedStatus === 'Book' ? 'selected' : ''}>Book</option>
                                <option value="Pending" ${savedStatus === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Approve" ${savedStatus === 'Approve' ? 'selected' : ''}>Approve</option>
                                <option value="Payment Pending" ${savedStatus === 'Payment Pending' ? 'selected' : ''}>Payment Pending</option>
                                <option value="Final Done" ${savedStatus === 'Final Done' ? 'selected' : ''}>Final Done</option>
                            </select>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });
            } catch (error) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red; padding:15px;">Global Cloud Server connect error!</td></tr>`;
            }
        }

        function saveLocalStatus(subId, newStatus) {
            localStorage.setItem(`status_global_${subId}`, newStatus);
            alert("Status changed successfully!");
        }

        document.getElementById('logoutBtn').addEventListener('click', function() {
            document.getElementById('dashboardPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('loginForm').reset();
        });
    </script>
</body>
</html>

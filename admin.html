<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jai Maa Travels - Secret Admin</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; display: none; }
        h2 { color: #ff5722; text-align: center; }
        .table-container { overflow-x: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; font-size: 14px; }
        th { background-color: #ff5722; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        select { padding: 6px; border-radius: 4px; font-weight: bold; border: 1px solid #ccc; cursor: pointer; }
        .status-book { background-color: #e3f2fd; color: #0d47a1; }
        .status-pending { background-color: #fff3e0; color: #e65100; }
        .status-approve { background-color: #e8f5e9; color: #1b5e20; }
        .status-pay { background-color: #fce4ec; color: #880e4f; }
        .status-done { background-color: #e0f2f1; color: #004d40; }
    </style>
</head>
<body>

    <h2>📋 Jai Maa Travels - Master Booking List</h2>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>📅 Booking Date & Time</th>
                    <th>👤 Customer Name</th>
                    <th>📞 Phone Number</th>
                    <th>📍 Destination</th>
                    <th>📆 Travel Date</th>
                    <th>⚙️ Change Status</th>
                </tr>
            </thead>
            <tbody id="adminTableBody">
                <tr><td colspan="6" style="text-align:center;">Fetching live database...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const sUrl = "https://supabase.co";
        const sKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndidGZweHZzd21qbmNsd3J5b3hzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDA2NzA3MjEsImV4cCI6MjA1NjI0NjcyMX0.XgI8v69Ew7C5r5_U84x2mP1-t8-eN9fO9k_N2g67b8U";

        // 1. Password Verification System
        function checkPassword() {
            const password = prompt("Enter Secret Admin Password to view Bookings:");
            if (password === "1234") {
                document.body.style.display = "block";
                fetchLiveBookings();
            } else {
                alert("Wrong Password! Access Denied.");
                window.location.href = "index.html"; // Wapas bhej dega
            }
        }

        // 2. Fetch Bookings with Date, Time and Status
        async function fetchLiveBookings() {
            const tableBody = document.getElementById('adminTableBody');
            try {
                const response = await fetch(`${sUrl}?select=*&order=id.desc`, {
                    method: 'GET',
                    headers: { 'apikey': sKey, 'Authorization': `Bearer ${sKey}` }
                });
                const bookings = await response.json();
                tableBody.innerHTML = "";

                if (bookings.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No bookings found online.</td></tr>`;
                    return;
                }

                bookings.forEach(booking => {
                    // Created_at date format thik karna
                    const submitDate = new Date(booking.created_at).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
                    const currentStatus = booking.status || 'Book';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${submitDate}</strong></td>
                        <td>${booking.name}</td>
                        <td><a href="tel:${booking.phone}">${booking.phone}</a></td>
                        <td>${booking.destination}</td>
                        <td>${booking.date}</td>
                        <td>
                            <select onchange="updateStatus(${booking.id}, this.value)" class="status-${currentStatus.toLowerCase().replace(' ', '')}">
                                <option value="Book" ${currentStatus === 'Book' ? 'selected' : ''}>Book</option>
                                <option value="Pending" ${currentStatus === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Approve" ${currentStatus === 'Approve' ? 'selected' : ''}>Approve</option>
                                <option value="Payment Pending" ${currentStatus === 'Payment Pending' ? 'selected' : ''}>Payment Pending</option>
                                <option value="Final Done" ${currentStatus === 'Final Done' ? 'selected' : ''}>Final Done</option>
                            </select>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });
            } catch (error) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">Error loading list.</td></tr>`;
            }
        }

        // 3. Status Database me update karne ka function
        async function updateStatus(bookingId, newStatus) {
            try {
                const response = await fetch(`${sUrl}?id=eq.${bookingId}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': sKey,
                        'Authorization': `Bearer ${sKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                if (response.ok) {
                    alert("Status updated successfully!");
                    fetchLiveBookings(); // List refresh karein colour badalne ke liye
                } else {
                    alert("Failed to update status.");
                }
            } catch (error) {
                alert("Network error while updating status.");
            }
        }

        // Page load par password puchein
        checkPassword();
    </script>
</body>
</html>

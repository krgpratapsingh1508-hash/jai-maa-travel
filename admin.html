<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jai Maa Travels - Master Admin Panel</title>
    <style>
        /* Pure Admin Panel Layout */
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; }
        h2 { color: #ff5722; text-align: center; margin-bottom: 20px; font-size: 26px; }
        
        /* Secure Login Box */
        .login-box { max-width: 400px; margin: 120px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        .btn { width: 100%; padding: 12px; background-color: #ff5722; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        
        /* Master Table Display */
        .dashboard-container { max-width: 1200px; margin: 20px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .table-responsive { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { border: 1px solid #ddd; padding: 14px; font-size: 15px; }
        th { background-color: #ff5722; color: white; font-weight: bold; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        
        /* Status Dropdown styling */
        select { padding: 8px; border-radius: 4px; font-weight: bold; border: 1px solid #ccc; cursor: pointer; font-size: 14px; }
        .hidden { display: none !important; }
        .logout-btn { background: #d32f2f; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; float: right; font-weight: bold; font-size: 14px; }
        .logout-btn:hover { background: #b71c1c; }
    </style>
</head>
<body>

    <!-- 1. 🔒 SECURITY LOGIN BOX (Sirf yahi dikhega shuruat me) -->
    <div id="loginPage" class="login-box">
        <h2>🛕 Admin Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Admin Name</label>
                <input type="text" id="adminName" required placeholder="Enter Admin Name">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" required placeholder="Enter Password">
            </div>
            <button type="submit" class="btn">Login to Dashboard</button>
        </form>
    </div>

    <!-- 2. 📋 MASTER BOOKING LIST TABLE (Login ke baad khulega, No Form Here) -->
    <div id="dashboardPage" class="dashboard-container hidden">
        <button id="logoutBtn" class="logout-btn">Secure Logout</button>
        <h2>📋 Jai Maa Travels - Master Booking List</h2>
        <div style="clear: both;"></div>
        
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>📅 Booking Date & Time</th>
                        <th>👤 Customer Name</th>
                        <th>📞 Phone Number</th>
                        <th>📍 Destination</th>
                        <th>📆 Travel Date</th>
                        <th>⚙️ Status Management</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <!-- Live entries yahan load hongi -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Central Cloud Connection
        const sUrl = "https://supabase.co"; 
        const sKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndidGZweHZzd21qbmNsd3J5b3hzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDA2NzA3MjEsImV4cCI6MjA1NjI0NjcyMX0.XgI8v69Ew7C5r5_U84x2mP1-t8-eN9fO9k_N2g67b8U";

        // Login core logic
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nameInput = document.getElementById('adminName').value;
            const passwordInput = document.getElementById('adminPassword').value;

            if (nameInput.toLowerCase() === "admin" && passwordInput === "1234") {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('dashboardPage').classList.remove('hidden');
                fetchLiveBookings(); 
            } else {
                alert("Galat Admin Name ya Password! Access Denied.");
            }
        });

        // Global list fetch system
        async function fetchLiveBookings() {
            const tableBody = document.getElementById('adminTableBody');
            tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 20px; font-weight:bold;">Fetching live global bookings...</td></tr>`;

            try {
                const response = await fetch(`${sUrl}?select=*&order=id.desc`, {
                    method: 'GET',
                    headers: { 'apikey': sKey, 'Authorization': `Bearer ${sKey}` }
                });

                const bookings = await response.json();
                tableBody.innerHTML = "";

                if (!bookings || bookings.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 20px;">No bookings found in database.</td></tr>`;
                    return;
                }

                bookings.forEach(booking => {
                    const submitDate = booking.created_at ? new Date(booking.created_at).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }) : 'N/A';
                    const currentStatus = booking.status || 'Book';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${submitDate}</strong></td>
                        <td>${booking.name || 'N/A'}</td>
                        <td><a href="tel:${booking.phone}" style="color: #ff5722; font-weight:bold; text-decoration:none;">${booking.phone || 'N/A'}</a></td>
                        <td>${booking.destination || 'N/A'}</td>
                        <td>${booking.date || 'N/A'}</td>
                        <td>
                            <select onchange="updateStatus(${booking.id}, this.value)">
                                <option value="Book" ${currentStatus === 'Book' ? 'selected' : ''}>Book</option>
                                <option value="Pending" ${currentStatus === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Approve" ${currentStatus === 'Approve' ? 'selected' : ''}>Approve</option>
                                <option value="Payment Pending" ${currentStatus === 'Payment Pending' ? 'selected' : ''}>Payment Pending</option>
                                <option value="Final Done" ${currentStatus === 'Final Done' ? 'selected' : ''}>Final Done</option>
                            </select>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });
            } catch (error) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red; padding: 20px;">Cloud connection failed!</td></tr>`;
            }
        }

        // Live status updating function
        async function updateStatus(bookingId, newStatus) {
            try {
                await fetch(`${sUrl}?id=eq.${bookingId}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': sKey,
                        'Authorization': `Bearer ${sKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                alert("Status globally updated!");
            } catch (error) {
                alert("Network error updating status!");
            }
        }

        // Secure Logout logic
        document.getElementById('logoutBtn').addEventListener('click', function() {
            document.getElementById('dashboardPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('loginForm').reset();
        });
    </script>
</body>
</html>

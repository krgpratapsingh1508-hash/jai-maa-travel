<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jai Maa Travels</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        html { scroll-behavior: smooth; }
        header { background-color: #ff5722; color: white; display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 24px; font-weight: bold; }
        nav ul { display: flex; list-style: none; }
        nav ul li { margin-left: 20px; }
        nav ul li a { color: white; text-decoration: none; font-weight: bold; }
        .hero { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://unsplash.com') no-repeat center center/cover; height: 45vh; display: flex; justify-content: center; align-items: center; text-align: center; color: white; }
        .hero-content h1 { font-size: 40px; margin-bottom: 10px; }
        .hero-content p { font-size: 18px; margin-bottom: 20px; }
        .btn { background-color: #ff5722; color: white; padding: 10px 25px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .booking { padding: 40px 5%; max-width: 600px; margin: 0 auto; }
        .booking h2 { text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .submit-btn { width: 100%; padding: 14px; background-color: #4caf50; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        #successMessage { margin-top: 20px; padding: 15px; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; border-radius: 4px; text-align: center; font-weight: bold; font-size: 16px; }
        .hidden { display: none !important; }
        footer { background-color: #333; color: white; text-align: center; padding: 15px; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🛕 Jai Maa Travels</div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#booking">Book Now</a></li>
            </ul>
        </nav>
    </header>

    <section id="home" class="hero">
        <div class="hero-content">
            <h1>Your Trusted Travel Partner</h1>
            <p>Safe, comfortable, and affordable journeys across India.</p>
            <a href="#booking" class="btn">Plan Your Trip</a>
        </div>
    </section>

    <!-- CUSTOMER BOOKING FORM -->
    <section id="booking" class="booking">
        <h2>Book Your Ride</h2>
        <form id="travelForm">
            <div class="form-group"><label>Full Name</label><input type="text" id="name" required placeholder="Enter your name"></div>
            <div class="form-group"><label>Phone Number</label><input type="tel" id="phone" required placeholder="Enter phone number"></div>
            <div class="form-group"><label>Where to?</label><input type="text" id="destination" required placeholder="Destination city"></div>
            <div class="form-group"><label>Travel Date</label><input type="date" id="date" required></div>
            <button type="submit" class="submit-btn">Confirm Booking</button>
        </form>
        <div id="successMessage" class="hidden"></div>
    </section>

    <footer><p>&copy; 2026 Jai Maa Travels. All Rights Reserved.</p></footer>

    <script>
        // 100% Free Open API for Google Sheets (No Blocking Server)
        const scriptUrl = "https://google.com"; 

        document.getElementById('travelForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const destination = document.getElementById('destination').value;
            const date = document.getElementById('date').value;
            const msgBox = document.getElementById('successMessage');

            msgBox.innerHTML = "Processing your booking...";
            msgBox.classList.remove('hidden');

            const currentDateTime = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });

            // URL Params format taaki server block na kar sake
            const uploadUrl = `${scriptUrl}?timestamp=${encodeURIComponent(currentDateTime)}&name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&destination=${encodeURIComponent(destination)}&date=${encodeURIComponent(date)}&status=Book`;

            try {
                const response = await fetch(uploadUrl, { method: 'GET', mode: 'no-cors' });

                // No-cors mode me content check nahi hota, request seedhe secure ho jati h
                msgBox.innerHTML = `🎉 Thank you, ${name}! Your booking for ${destination} has been registered successfully.`;
                document.getElementById('travelForm').reset();
            } catch (error) {
                msgBox.innerHTML = "⚠️ Temporary network lag. Please try refresh and submit again.";
            }
        });
    </script>
</body>
</html>
